<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>游刃 Architecture</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
    }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; }
  main { max-width: 800px; margin: 2rem auto; padding: 1rem; }
  svg { display: block; width: 100%; height: auto; }
  .caption { text-align: center; margin-top: 1rem; color: var(--muted); font-size: 0.85rem; }
</style>
<main>
  <svg viewBox="0 0 700 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
    <!-- connectors -->
    <!-- LLM → WSL -->
    <line x1="350" y1="160" x2="350" y2="220" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- WSL → agent.py -->
    <line x1="350" y1="320" x2="350" y2="380" stroke="#64748b" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
    <text x="360" y="355" fill="#5b6475" font-size="11">inbox/outbox JSON</text>
    <!-- agent.py → Godot -->
    <line x1="350" y1="480" x2="350" y2="540" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- arrowhead marker -->
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-auto">
        <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/>
      </marker>
      <marker id="arrow-up" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/>
      </marker>
      <!-- glow filter for top node -->
      <filter id="glow">
        <feGaussianBlur stdDeviation="4" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <!-- Layer backgrounds (swimlanes) -->
    <rect x="30" y="20" rx="8" ry="8" width="640" height="155" fill="var(--input)" opacity="0.15"/>
    <text x="45" y="48" fill="var(--muted)" font-size="11" font-weight="600" letter-spacing="1">LLM LAYER</text>

    <rect x="30" y="210" rx="8" ry="8" width="640" height="140" fill="var(--process)" opacity="0.15"/>
    <text x="45" y="238" fill="var(--muted)" font-size="11" font-weight="600" letter-spacing="1">BRIDGE LAYER — WSL / Linux</text>

    <rect x="30" y="385" rx="8" ry="8" width="640" height="125" fill="var(--storage)" opacity="0.15"/>
    <text x="45" y="413" fill="var(--muted)" font-size="11" font-weight="600" letter-spacing="1">AGENT LAYER — Windows</text>

    <rect x="30" y="535" rx="8" ry="8" width="640" height="70" fill="var(--external)" opacity="0.15"/>
    <text x="45" y="560" fill="var(--muted)" font-size="11" font-weight="600" letter-spacing="1">ENGINE LAYER — Windows</text>

    <!-- Node: LLM Brain -->
    <rect x="200" y="65" rx="12" ry="12" width="300" height="80" fill="var(--input)" stroke="#3b82f6" stroke-width="2"/>
    <text x="350" y="95" text-anchor="middle" fill="var(--fg)" font-size="16" font-weight="700">🧠  LLM Brain</text>
    <text x="350" y="118" text-anchor="middle" fill="var(--muted)" font-size="12">Write GDScript · Design Architecture</text>
    <text x="350" y="136" text-anchor="middle" fill="var(--muted)" font-size="12">Generate Tests · Iterate</text>

    <!-- Node: File Bridge -->
    <rect x="200" y="230" rx="12" ry="12" width="300" height="70" fill="var(--process)" stroke="#6366f1" stroke-width="2"/>
    <text x="350" y="260" text-anchor="middle" fill="var(--fg)" font-size="15" font-weight="700">📁  File Bridge</text>
    <text x="350" y="282" text-anchor="middle" fill="var(--muted)" font-size="12">inbox/cmd.json → outbox/result.json</text>

    <!-- Node: Agent.py -->
    <rect x="150" y="395" rx="12" ry="12" width="400" height="100" fill="var(--storage)" stroke="#14b8a6" stroke-width="2"/>
    <text x="350" y="425" text-anchor="middle" fill="var(--fg)" font-size="15" font-weight="700">🤖  agent.py (Windows Shell)</text>
    <text x="350" y="448" text-anchor="middle" fill="var(--muted)" font-size="12">Execute Commands · Read/Write Files</text>
    <text x="350" y="466" text-anchor="middle" fill="var(--muted)" font-size="12">Launch Godot Headless · Run Tests</text>
    <text x="350" y="484" text-anchor="middle" fill="var(--muted)" font-size="12">Build & Export</text>

    <!-- Node: Godot -->
    <rect x="175" y="545" rx="12" ry="12" width="350" height="50" fill="var(--external)" stroke="#f59e0b" stroke-width="2"/>
    <text x="350" y="570" text-anchor="middle" fill="var(--fg)" font-size="15" font-weight="700">🎮  Godot 4.x Engine</text>
    <text x="350" y="588" text-anchor="middle" fill="var(--muted)" font-size="11">Compile · Test · Export .exe</text>

    <!-- feedback arrow -->
    <path d="M 175 570 L 60 570 L 60 105 L 190 105" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arrow-up)"/>
    <text x="62" y="350" fill="#5b6475" font-size="11" transform="rotate(-90, 62, 350)">Feedback Loop</text>
  </svg>
  <p class="caption">游刃 (Youren) — AI-Native Godot Development Toolkit Architecture</p>
</main>
